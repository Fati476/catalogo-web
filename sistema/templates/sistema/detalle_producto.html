{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>{{ producto.nombre }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f8f9fa;">

<div class="container py-5">

    <div class="row">

        <!-- Imagen -->

        <div class="col-lg-6">

            {% if producto.imagen_principal %}

                <img src="{{ producto.imagen_principal.imagen.url }}"
                     class="img-fluid rounded-4 shadow">

            {% else %}

                <div class="bg-light rounded-4 d-flex justify-content-center align-items-center"
                     style="height:500px">

                    Sin imagen

                </div>

            {% endif %}

        </div>

        <!-- Información -->

        <div class="col-lg-6">

            <small class="text-warning fw-bold">

                {{ producto.categoria.nombre }}

            </small>

            <h1 class="display-4 fw-bold mt-2">

                {{ producto.nombre }}

            </h1>

            <hr>

            <p class="lead">

                {{ producto.descripcion }}

            </p>

            <a href="{% url 'agregar_cotizacion' producto.id %}"
               class="btn btn-warning btn-lg rounded-pill mt-4">

                Agregar a solicitud

            </a>

        </div>

    </div>

</div>

</body>
</html>
