<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Todas las categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .category-card{
            transition: .2s ease;
        }

        .category-card:hover{
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }
    </style>
</head>

<body style="background:#F5F7FB; padding-top:75px;">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
    <div class="container-fluid px-3">

        <a class="navbar-brand fw-bold text-warning fs-4" href="#">
            Catálogo
        </a>

        <div class="collapse navbar-collapse show">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">🏠 Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'todas_categorias' %}">📂 Categorías</a></li>
                <li class="nav-item"><a class="nav-link" href="#">📋 Cotizaciones</a></li>
                <li class="nav-item"><a class="nav-link" href="#">❤️ Favoritos</a></li>
                <li class="nav-item"><a class="nav-link" href="#">👤 Perfil</a></li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="{% url 'logout' %}">
                            🚪 Cerrar sesión
                        </a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<div class="container mt-4">

    <h3 class="fw-bold mb-4">Todas las categorías</h3>

    <div class="row g-3">

        {% for categoria in categorias %}

        <div class="col-6 col-md-4 col-lg-3">

            <a href="{% url 'productos_categoria' categoria.id %}"
               class="text-decoration-none">

                <div class="bg-white shadow-sm rounded-4 text-center py-5 px-2 fw-semibold category-card">

                    {{ categoria.nombre }}

                </div>

            </a>

        </div>

        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
