<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Editar producto</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family:'Poppins', sans-serif;
        }

        body{

            background:#F1F5F9;

        }

        .contenedor{

            max-width:700px;

            margin:auto;

            padding:60px 20px;

        }

        .card-form{

            background:white;

            border:none;

            border-radius:28px;

            padding:40px;

            box-shadow:0 10px 25px rgba(0,0,0,0.05);

        }

        h1{

            font-weight:700;

            margin-bottom:30px;

            color:#0F172A;

        }

        label{

            font-weight:600;

            margin-bottom:8px;

        }

        input,
        textarea,
        select{

            border-radius:14px !important;

            padding:12px !important;

        }

        .btn-custom{

            border:none;

            border-radius:14px;

            padding:12px 20px;

            font-weight:600;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <div class="card-form">

        <h1>

            <i class="bi bi-pencil-square"></i>
            Editar producto

        </h1>

        <form method="POST">
            enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">

                <label>
                    Nombre
                </label>

                {{ form.nombre }}

            </div>

            <div class="mb-3">

                <label>
                    Descripción
                </label>

                {{ form.descripcion }}

            </div>

            <div class="mb-3">

                <label>
                    Precio
                </label>

                {{ form.precio }}

            </div>

            <div class="mb-4">

                <label>
                    Categoría
                </label>

                {{ form.categoria }}

            </div>
            
            <div class="mb-4 mt-4">

                <label>
                    Agregar imagen
                </label>

                {{ imagen_form.imagen }}

            </div>

            <div class="row mt-4">

                {% for imagen in imagenes %}

                <div class="col-md-4 mb-3">

                    <img src="{{ imagen.imagen.url }}"
                         class="img-fluid rounded shadow">

                </div>

                {% endfor %}

            </div>


            <div class="d-flex gap-3">

                <button type="submit"
                        class="btn btn-primary btn-custom">

                    <i class="bi bi-check-circle"></i>
                    Guardar cambios

                </button>

                <a href="{% url 'lista_productos' %}"
                   class="btn btn-secondary btn-custom">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
