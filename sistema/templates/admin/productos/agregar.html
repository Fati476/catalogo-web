<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Agregar producto</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#F1F5F9;
        }

        .contenedor{
            max-width:1000px;
            margin:auto;
            padding:50px 20px;
        }

        .card-form{
            background:white;
            border:none;
            border-radius:30px;
            padding:40px;
            box-shadow:0 10px 25px rgba(0,0,0,0.05);
        }

        .titulo{
            font-weight:700;
            color:#0F172A;
        }

        label{
            font-weight:600;
            margin-bottom:8px;
        }

        .form-control,
        .form-select{
            border-radius:16px;
            padding:12px;
        }

        .preview-card{
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .preview-card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

        .preview-card{
            position:relative;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .preview-card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <a href="{% url 'lista_productos' %}"
       class="btn btn-light shadow-sm rounded-pill mb-4 px-4">

        <i class="bi bi-arrow-left"></i>
        Volver

    </a>

    <div class="card-form">

        <h1 class="titulo mb-2">

            <i class="bi bi-box-seam"></i>
            Agregar producto

        </h1>

        <p class="text-muted mb-5">

            Registra un nuevo producto en el catálogo

        </p>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-8 mb-4">

                    <label>Nombre</label>

                    {{ form.nombre }}

                </div>

                <div class="col-md-4 mb-4">

                    <label>Precio</label>

                    {{ form.precio }}

                </div>

            </div>

            <div class="mb-4">

                <label>Descripción</label>

                {{ form.descripcion }}

            </div>

            <div class="mb-4">

                <label>Categoría</label>

                {{ form.categoria }}

            </div>

            <hr class="my-5">

            <h4 class="fw-bold mb-4">

                Agregar imágenes

            </h4>

            <input type="file"
                   name="imagen"
                   id="imagenInput"
                   multiple
                   class="form-control">

            <div class="row mt-4"
                 id="preview-container">

            </div>

            <div class="d-flex gap-3 mt-5">

                <button type="submit"
                        class="btn btn-primary rounded-pill px-5">

                    <i class="bi bi-check-circle"></i>
                    Guardar producto

                </button>

                <a href="{% url 'lista_productos' %}"
                   class="btn btn-secondary rounded-pill px-5">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

<script>

const input = document.getElementById('imagenInput');
const previewContainer = document.getElementById('preview-container');

let archivosSeleccionados = [];

input.addEventListener('change', function() {

    archivosSeleccionados = Array.from(this.files);

    mostrarPreview();

});

function mostrarPreview(){

    previewContainer.innerHTML = '';

    archivosSeleccionados.forEach((archivo, index) => {

        const reader = new FileReader();

        reader.onload = function(e){

            const col = document.createElement('div');

            col.classList.add('col-md-3','mb-4');

            col.innerHTML = `

                <div class="position-relative preview-card">

                    <img src="${e.target.result}">

                    <button type="button"
                            class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
                            onclick="eliminarImagen(${index})">

                        <i class="bi bi-x-lg"></i>

                    </button>

                </div>

            `;

            previewContainer.appendChild(col);

        }

        reader.readAsDataURL(archivo);

    });

}

function eliminarImagen(index){

    archivosSeleccionados.splice(index,1);

    mostrarPreview();

}

</script>

</body>
</html>
