<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Agregar producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            Agregar producto
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success">

                Guardar producto

            </button>

        </form>

    </div>

</div>

</body>
</html>
