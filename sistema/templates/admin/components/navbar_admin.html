{% load static %}

<nav class="navbar navbar-expand-xl navbar-dark navbar-admin fixed-top">
    <div class="container-fluid px-4">

        <a href="{% url 'panel_admin' %}" class="navbar-brand-admin">
            <img src="{% static 'img/imagen.png' %}" alt="Logo">

            <div>
                <div class="brand-title">Panel Admin</div>
                <div class="brand-subtitle">Cooperativa Pirotécnica</div>
            </div>
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuAdmin">

            <ul class="navbar-nav mx-auto gap-xl-2">

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'panel_admin' %}active{% endif %}"
                       href="{% url 'panel_admin' %}">
                        <i class="bi bi-house-door"></i>
                        Inicio
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_productos' %}active{% endif %}"
                       href="{% url 'lista_productos' %}">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_categorias' %}active{% endif %}"
                       href="{% url 'lista_categorias' %}">
                        <i class="bi bi-tags"></i>
                        Categorías
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_solicitudes' %}active{% endif %}"
                       href="{% url 'lista_solicitudes' %}">
                        <i class="bi bi-file-earmark-text"></i>
                        Cotizaciones
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'lista_usuarios' %}active{% endif %}"
                       href="{% url 'lista_usuarios' %}">
                        <i class="bi bi-people"></i>
                        Usuarios
                    </a>
                </li>

            </ul>

            <div class="dropdown ms-xl-4">

                <button class="btn-admin-user"
                        type="button"
                        data-bs-toggle="dropdown">

                    <div class="avatar-admin">
                        {{ request.user.first_name|first|default:request.user.username|first|upper }}
                    </div>

                    <div class="user-info">
                        <strong>
                            {{ request.user.first_name|default:request.user.username }}
                        </strong>
                        <small>Administrador</small>
                    </div>

                    <i class="bi bi-chevron-down"></i>
                </button>

                <ul class="dropdown-menu dropdown-menu-end dropdown-admin">

                    <li>
                        <h6 class="dropdown-header">
                            {{ request.user.get_full_name|default:request.user.username }}
                        </h6>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <form method="POST" action="/accounts/logout/">
                            {% csrf_token %}

                            <button type="submit" class="dropdown-item item-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Cerrar sesión
                            </button>
                        </form>
                    </li>

                </ul>

            </div>

        </div>

    </div>
</nav>
