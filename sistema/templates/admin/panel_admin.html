<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="bg-dark text-white p-3"
         style="width:250px; height:100vh;">

        <h3 class="mb-4">
            Admin Panel
        </h3>

        <a href="{% url 'panel_admin' %}"
           class="d-block text-white mb-3 text-decoration-none">

            🏠 Dashboard

        </a>

        <a href="{% url 'lista_productos' %}"
           class="d-block text-white mb-3 text-decoration-none">

            📦 Productos

        </a>

        <a href="{% url 'lista_categorias' %}"
           class="d-block text-white mb-3 text-decoration-none">

            🏷 Categorías

        </a>

        <a href="/admin/"
           class="d-block text-white mb-3 text-decoration-none">

            ⚙ Django Admin

        </a>

        <a href="{% url 'logout' %}"
           class="d-block text-danger text-decoration-none">

            🚪 Cerrar sesión

        </a>

    </div>

    <!-- CONTENIDO -->
    <div class="p-5 w-100">

        <h1 class="fw-bold">
            Bienvenido {{ request.user.username }}
        </h1>

        <p class="text-muted">
            Panel de administración del catálogo
        </p>

        <!-- TARJETAS -->
        <div class="row mt-4">

            <div class="col-md-4">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body">

                        <h3>
                            📦 Productos
                        </h3>

                        <p>
                            Administrar productos
                        </p>

                        <a href="{% url 'lista_productos' %}"
                           class="btn btn-primary">

                            Entrar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body">

                        <h3>
                            🏷 Categorías
                        </h3>

                        <p>
                            Administrar categorías
                        </p>

                        <a href="{% url 'lista_categorias' %}"
                           class="btn btn-success">

                            Entrar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
