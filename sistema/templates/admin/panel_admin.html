<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:#F1F5F9;

        }

        /* SIDEBAR */

        .sidebar{

            width:90px;
            height:100vh;

            background:#0F172A;

            position:fixed;

            display:flex;

            flex-direction:column;

            align-items:center;

            padding-top:25px;

        }

        .logo{

            width:55px;
            height:55px;

            background:#2563EB;

            border-radius:18px;

            display:flex;

            justify-content:center;
            align-items:center;

            color:white;

            font-size:28px;

            margin-bottom:50px;

        }

        .menu{

            width:100%;
        }

        .menu a{

            width:100%;
            height:70px;

            display:flex;

            justify-content:center;
            align-items:center;

            color:#CBD5E1;

            text-decoration:none;

            font-size:24px;

            transition:.3s;

        }

        .menu a:hover{

            background:#1E293B;

            color:white;

        }

        /* CONTENIDO */

        .contenido{

            margin-left:90px;

            padding:30px;

        }

        /* TOPBAR */

        .topbar{

            background:white;

            border-radius:25px;

            padding:20px 30px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            box-shadow:0 5px 20px rgba(0,0,0,0.05);

            margin-bottom:35px;

        }

        .titulo{

            font-size:32px;
            font-weight:700;

            color:#0F172A;

        }

        .subtitulo{

            color:#64748B;

        }

        .perfil{

            display:flex;

            align-items:center;

            gap:15px;

        }

        .perfil i{

            font-size:38px;

            color:#2563EB;

        }

        /* CARDS */

        .card-estadistica{

            background:white;

            border:none;

            border-radius:25px;

            padding:25px;

            box-shadow:0 10px 20px rgba(0,0,0,0.05);

            transition:.3s;

        }

        .card-estadistica:hover{

            transform:translateY(-5px);

        }

        .numero{

            font-size:40px;

            font-weight:700;

            color:#0F172A;

        }

        .texto{

            color:#64748B;

        }

        /* MODULOS */

        .modulo{

            background:white;

            border:none;

            border-radius:30px;

            padding:35px;

            box-shadow:0 10px 20px rgba(0,0,0,0.05);

            transition:.3s;

            height:100%;

        }

        .modulo:hover{

            transform:translateY(-8px);

        }

        .icono{

            width:80px;
            height:80px;

            border-radius:20px;

            display:flex;

            justify-content:center;
            align-items:center;

            font-size:35px;

            margin-bottom:25px;

        }

        .azul{

            background:#DBEAFE;
            color:#2563EB;

        }

        .verde{

            background:#DCFCE7;
            color:#16A34A;

        }

        .rojo{

            background:#FEE2E2;
            color:#DC2626;

        }

        .amarillo{

            background:#FEF9C3;
            color:#CA8A04;

        }

        .btn-custom{

            border:none;

            border-radius:14px;

            padding:12px 22px;

            font-weight:600;

        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        <i class="bi bi-grid-fill"></i>
    </div>

    <div class="menu">

        <a href="{% url 'panel_admin' %}"
           title="Dashboard">

            <i class="bi bi-house-fill"></i>

        </a>

        <a href="{% url 'lista_productos' %}"
           title="Productos">

            <i class="bi bi-box-seam"></i>

        </a>

        <a href="{% url 'lista_categorias' %}"
           title="Categorías">

            <i class="bi bi-tags-fill"></i>

        </a>

        <a href="#"
           title="Cotizaciones">

            <i class="bi bi-file-earmark-text"></i>

        </a>

        <a href="#"
           title="Usuarios">

            <i class="bi bi-people-fill"></i>

        </a>

        <a href="/accounts/logout/"
           title="Cerrar sesión">

            <i class="bi bi-box-arrow-left"></i>

        </a>

    </div>

</div>

<!-- CONTENIDO -->

<div class="contenido">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h1 class="titulo">
                Dashboard
            </h1>

            <p class="subtitulo">
                Panel administrativo del catálogo
            </p>

        </div>

        <div class="perfil">

            <i class="bi bi-person-circle"></i>

            <div>

                <strong>
                    {{ request.user.username }}
                </strong>

                <br>

                <small class="text-muted">
                    Administrador
                </small>

            </div>

        </div>

    </div>

    <!-- ESTADISTICAS -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card-estadistica">

                <p class="texto">
                    Productos
                </p>

                <h2 class="numero">
                    {{ total_productos }}
                </h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card-estadistica">

                <p class="texto">
                    Categorías
                </p>

                <h2 class="numero">
                    {{ total_categorias }}
                </h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card-estadistica">

                <p class="texto">
                    Cotizaciones
                </p>

                <h2 class="numero">
                    0
                </h2>

            </div>

        </div>

    </div>

    <!-- MODULOS -->

    <div class="row g-4">

        <div class="col-md-6">

            <div class="modulo">

                <div class="icono azul">

                    <i class="bi bi-box-seam"></i>

                </div>

                <h2>
                    Productos
                </h2>

                <p class="text-muted">
                    Administra productos del catálogo
                </p>

                <a href="{% url 'lista_productos' %}"
                   class="btn btn-primary btn-custom">

                    Entrar

                </a>

            </div>

        </div>

        <div class="col-md-6">

            <div class="modulo">

                <div class="icono verde">

                    <i class="bi bi-tags-fill"></i>

                </div>

                <h2>
                    Categorías
                </h2>

                <p class="text-muted">
                    Gestiona categorías del sistema
                </p>

                <a href="{% url 'lista_categorias' %}"
                   class="btn btn-success btn-custom">

                    Entrar

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
