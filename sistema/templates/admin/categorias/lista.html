<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Categorías</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: #F1F5F9;
        }

        .sidebar{

            width: 250px;
            height: 100vh;
            background: #111827;
            position: fixed;
            padding-top: 30px;

        }

        .sidebar h3{
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a{

            display: block;
            color: #D1D5DB;
            padding: 15px 25px;
            text-decoration: none;
            transition: 0.3s;

        }

        .sidebar a:hover{

            background: #1F2937;
            color: white;

        }

        .contenido{

            margin-left: 250px;
            padding: 40px;

        }

        .card-tabla{

            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);

        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>
        Admin Panel
    </h3>

    <a href="#">
        <i class="bi bi-grid"></i>
        Dashboard
    </a>

    <a href="{% url 'lista_categorias' %}">

        <i class="bi bi-tags"></i>
        Categorías

    </a>

    <a href="{% url 'lista_productos' %}">

        <i class="bi bi-box-seam"></i>
        Productos

    </a>

</div>

<div class="contenido">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                Categorías
            </h2>

            <p class="text-muted">
                Administración de categorías
            </p>

        </div>

        <a href="{% url 'agregar_categoria' %}"
           class="btn btn-dark">

            <i class="bi bi-plus-circle"></i>
            Nueva categoría

        </a>

    </div>

    <div class="card-tabla">

        <table class="table align-middle">

            <thead>

                <tr>

                    <th>Nombre</th>
                    <th>Descripción</th>

                </tr>

            </thead>

            <tbody>

                {% for categoria in categorias %}

                <tr>

                    <td>
                        {{ categoria.nombre }}
                    </td>

                    <td>
                        {{ categoria.descripcion }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
