<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Nueva Categoría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow border-0 p-4 rounded-4">

        <h2 class="mb-4">
            Nueva categoría
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-dark">

                Guardar categoría

            </button>

        </form>

    </div>

</div>

</body>
</html>
