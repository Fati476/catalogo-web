<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg,#667eea,#764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-registro{
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer{

            from{
                opacity: 0;
                transform: translateY(20px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }

        }

        .logo{
            width: 85px;
            height: 85px;
            background: #2563EB;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-bottom: 20px;
        }

        .logo i{
            color: white;
            font-size: 36px;
        }

        .titulo{
            text-align: center;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .subtitulo{
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label{
            font-weight: 600;
            color: white;
        }

        .form-control,
        .form-select{
            border-radius: 12px;
            padding: 12px;
            transition: 0.3s;
            background: rgba(255,255,255,0.9);
            border: none;
        }

        .form-control:focus,
        .form-select:focus{
            border-color: #2563EB;
            box-shadow: 0 0 0 0.15rem rgba(37,99,235,0.25);
        }

        .input-group-text{
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
        }

        .btn-registro{
            background: #2563EB;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-registro:hover{
            background: #1D4ED8;
            transform: translateY(-1px);
        }

        .extra-links{
            text-align: center;
            margin-top: 20px;
        }

        .extra-links a{
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        .extra-links a:hover{
            text-decoration: underline;
            color: #f1f1f1;
        }

        .accesibilidad{
            margin-top: 20px;
            background: #F8FAFC;
            padding: 14px;
            border-radius: 14px;
            font-size: 13px;
            color: #475569;
        }

        .accesibilidad i{
            color: #2563EB;
            margin-right: 5px;
        }

        .toggle-password{
            cursor: pointer;
            background: #F8FAFC;
        }

        .toggle-password:hover{
            background: #E2E8F0;
        }

        @media(max-width: 576px){

            .card-registro{
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

<div class="card-registro">

    <div class="logo">

        <i class="bi bi-person-plus-fill"></i>

    </div>

    <h2 class="titulo">
        Crear Cuenta
    </h2>

    <p class="subtitulo">
        Regístrate para solicitar cotizaciones y acceder al catálogo web
    </p>

    <form method="POST">

        {% csrf_token %}

        <!-- Usuario -->

        <div class="mb-3">

            <label class="form-label">
                Usuario
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Ingrese su usuario"
                       required>

            </div>

        </div>

        <!-- Correo -->

        <div class="mb-3">

            <label class="form-label">
                Correo electrónico
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="correo@gmail.com"
                       required>

            </div>

        </div>

        <!-- Municipio -->

        <div class="mb-3">

            <label class="form-label">
                Municipio / Ciudad
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-geo-alt"></i>
                </span>

                <input type="text"
                       name="municipio"
                       class="form-control"
                       placeholder="Ejemplo: Toluca, Metepec..."
                       required>

            </div>

        </div>

        <!-- Estado -->

        <div class="mb-3">

            <label class="form-label">
                Estado
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-map"></i>
                </span>

                <select name="estado"
                        class="form-select"
                        required>

                    <option value="">
                        Seleccione un estado
                    </option>

                    <option>Estado de México</option>
                    <option>Ciudad de México</option>
                    <option>Jalisco</option>
                    <option>Puebla</option>
                    <option>Nuevo León</option>
                    <option>Querétaro</option>
                    <option>Hidalgo</option>
                    <option>Morelos</option>
                    <option>Otro</option>

                </select>

            </div>

        </div>

        <!-- Contraseña -->

        <div class="mb-3">

            <label class="form-label">
                Contraseña
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input type="password"
                       name="password1"
                       id="password1"
                       class="form-control"
                       placeholder="Ingrese contraseña"
                       required>

                <span class="input-group-text toggle-password"
                      onclick="mostrarPassword('password1', this)">

                    <i class="bi bi-eye"></i>

                </span>

            </div>

        </div>

        <!-- Confirmar contraseña -->

        <div class="mb-4">

            <label class="form-label">
                Confirmar contraseña
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-shield-lock"></i>
                </span>

                <input type="password"
                       name="password2"
                       id="password2"
                       class="form-control"
                       placeholder="Repita contraseña"
                       required>

                <span class="input-group-text toggle-password"
                      onclick="mostrarPassword('password2', this)">

                    <i class="bi bi-eye"></i>

                </span>

            </div>

        </div>

        <button type="submit"
                class="btn btn-primary btn-registro w-100">

            <i class="bi bi-check-circle"></i>
            Registrarse

        </button>

    </form>

    <div class="extra-links">

        <p class="mt-3">

            ¿Ya tienes cuenta?

            <a href="{% url 'login' %}">
                Iniciar sesión
            </a>

        </p>

        <a href="{% url 'password_reset' %}">
            ¿Olvidaste tu contraseña?
        </a>

    </div>

    <div class="accesibilidad">

        <p class="mb-1">

            <i class="bi bi-universal-access"></i>

            Diseño inclusivo y adaptable para todos los usuarios.

        </p>

        <p class="mb-0">

            Compatible con dispositivos móviles y lectura accesible.

        </p>

    </div>

</div>

<script>

    function mostrarPassword(id, elemento){

        let input = document.getElementById(id);
        let icono = elemento.querySelector("i");

        if(input.type === "password"){

            input.type = "text";

            icono.classList.remove("bi-eye");
            icono.classList.add("bi-eye-slash");

        }else{

            input.type = "password";

            icono.classList.remove("bi-eye-slash");
            icono.classList.add("bi-eye");

        }

    }

</script>

</body>
</html>
