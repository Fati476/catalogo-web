<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-registro{
            width: 100%;
            max-width: 480px;
            background: #FFFFFF;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer{
            from{
                opacity: 0;
                transform: translateY(20px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo{
            width: 80px;
            height: 80px;
            background: #2563EB;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-bottom: 20px;
        }

        .logo i{
            color: white;
            font-size: 35px;
        }

        .titulo{
            text-align: center;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 8px;
        }

        .subtitulo{
            text-align: center;
            color: #64748B;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label{
            font-weight: 600;
            color: #1E293B;
        }

        .form-control{
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #CBD5E1;
            transition: 0.3s;
        }

        .form-control:focus{
            border-color: #2563EB;
            box-shadow: 0 0 0 0.15rem rgba(37, 99, 235, 0.25);
        }

        .input-group-text{
            border-radius: 12px 0 0 12px;
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
        }

        .btn-registro{
            background: #2563EB;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-registro:hover{
            background: #1D4ED8;
            transform: translateY(-1px);
        }

        .extra-links{
            text-align: center;
            margin-top: 20px;
        }

        .extra-links a{
            text-decoration: none;
            color: #2563EB;
            font-weight: 500;
        }

        .extra-links a:hover{
            text-decoration: underline;
        }

        .accesibilidad{
            background: #F8FAFC;
            border-radius: 12px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #475569;
        }

        .accesibilidad i{
            color: #2563EB;
            margin-right: 5px;
        }

        @media(max-width: 576px){

            .card-registro{
                margin: 20px;
                padding: 30px 25px;
            }

        }

    </style>

</head>

<body>

<div class="card-registro">

    <div class="logo">

        <i class="bi bi-person-plus-fill"></i>

    </div>

    <h2 class="titulo">
        Crear Cuenta
    </h2>

    <p class="subtitulo">
        Regístrate para acceder al catálogo web
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Usuario
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Ingrese su usuario"
                       required>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Correo electrónico
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="correo@gmail.com"
                       required>

            </div>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Contraseña
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input type="password"
                       name="password1"
                       class="form-control"
                       placeholder="Ingrese contraseña"
                       required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Confirmar contraseña
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-shield-lock"></i>
                </span>

                <input type="password"
                       name="password2"
                       class="form-control"
                       placeholder="Repita contraseña"
                       required>

            </div>

        </div>

        <button type="submit"
                class="btn btn-primary btn-registro w-100">

            <i class="bi bi-check-circle"></i>
            Registrarse

        </button>

    </form>

    <div class="extra-links">

        <p class="mt-3">

            ¿Ya tienes cuenta?

            <a href="{% url 'login' %}">
                Iniciar sesión
            </a>

        </p>

        <a href="{% url 'password_reset' %}">
            ¿Olvidaste tu contraseña?
        </a>

    </div>

    <div class="accesibilidad">

        <p class="mb-1">
            <i class="bi bi-universal-access"></i>
            Diseño accesible y adaptable
        </p>

        <p class="mb-0">
            Compatible con dispositivos móviles y tamaños de texto legibles.
        </p>

    </div>

</div>

</body>
</html>
