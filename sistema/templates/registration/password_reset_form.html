{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    overflow:hidden;
}

.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg, rgba(0,0,0,.82), rgba(15,15,15,.55), rgba(0,0,0,.82));
    z-index:-2;
}

.reset-box{
    width:100%;
    max-width:430px;
    background:rgba(15,15,15,.58);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:30px;
    padding:34px;
    color:white;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    animation:aparecer .65s ease;
}

@keyframes aparecer{
    from{opacity:0;transform:translateY(25px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.logo-reset{
    display:block;
    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:50%;
    margin:0 auto 18px;
    background:white;
    padding:6px;
}

.titulo{
    text-align:center;
    font-weight:900;
    font-size:2rem;
}

.titulo span{
    color:#D4AF37;
}

.subtitulo{
    text-align:center;
    color:rgba(255,255,255,.72);
    margin-bottom:26px;
    font-size:.95rem;
}

.input-group-text{
    background:rgba(255,255,255,.10);
    color:#D4AF37;
    border:1px solid rgba(255,255,255,.10);
    border-right:0;
    border-radius:18px 0 0 18px;
}

.form-control{
    background:rgba(255,255,255,.10);
    color:white;
    border:1px solid rgba(255,255,255,.10);
    border-left:0;
    padding:13px 14px;
    border-radius:0 18px 18px 0;
}

.form-control::placeholder{
    color:rgba(255,255,255,.62);
}

.form-control:focus{
    background:rgba(255,255,255,.14);
    color:white;
    border-color:rgba(212,175,55,.60);
    box-shadow:none;
}

.btn-reset{
    width:100%;
    border:0;
    border-radius:999px;
    padding:13px;
    background:#C9A227;
    color:#111827;
    font-weight:900;
    transition:.3s;
}

.btn-reset:hover{
    background:#B8860B;
    color:#111827;
    transform:translateY(-2px);
}

.link-login{
    color:rgba(255,255,255,.82);
    text-decoration:none;
    font-weight:700;
}

.link-login:hover{
    color:#D4AF37;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline class="bg-video">
    <source src="{% static 'videos/Video.mp4' %}" type="video/mp4">
</video>

<div class="video-overlay"></div>

<div class="reset-box">

    <img src="{% static 'img/imagen.png' %}" class="logo-reset">

    <h2 class="titulo">
        Recuperar <span>contraseña</span>
    </h2>

    <p class="subtitulo">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group mb-4">
            <span class="input-group-text">
                <i class="fa-solid fa-envelope"></i>
            </span>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Correo electrónico"
                   required>
        </div>

        <button type="submit" class="btn-reset">
            <i class="fa-solid fa-paper-plane me-2"></i>
            Enviar enlace
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="link-login">
            Volver al inicio de sesión
        </a>
    </div>

</div>

</body>
</html>
