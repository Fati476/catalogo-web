<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box{
            background:white;
            padding:40px;
            width:400px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation: aparecer 0.6s ease;
        }

        @keyframes aparecer{
            from{
                opacity:0;
                transform:translateY(-20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .titulo{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
            color:#333;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
        }

        .btn-login{
            width:100%;
            border-radius:12px;
            padding:12px;
            background:#4facfe;
            border:none;
            color:white;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#00c6fb;
            transform:scale(1.02);
        }

        .registro{
            text-align:center;
            margin-top:15px;
        }

        .registro a{
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h2 class="titulo">Iniciar Sesión</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="username" class="form-control">
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control">
            </div>

            <button type="submit" class="btn-login">
                Entrar
            </button>

        </form>

        <div class="registro">
            <p>
                ¿No tienes cuenta?
                <a href="{% url 'registro' %}">
                    Regístrate
                </a>
            </p>
        </div>

    </div>

</body>
</html>
