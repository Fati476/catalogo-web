{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña actualizada</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    overflow:hidden;
}

.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(
        135deg,
        rgba(0,0,0,.82),
        rgba(15,15,15,.55),
        rgba(0,0,0,.82)
    );
    z-index:-2;
}

.reset-box{
    width:100%;
    max-width:430px;
    background:rgba(15,15,15,.58);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:30px;
    padding:34px;
    color:white;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    animation:aparecer .6s ease;
}

@keyframes aparecer{

    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.logo{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    padding:6px;
    margin:0 auto 20px;
    display:block;
}

.icon-success{

    width:70px;
    height:70px;
    margin:0 auto 20px;

    border-radius:50%;

    background:#C9A227;

    color:#111827;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

}

.titulo{

    font-size:2rem;
    font-weight:900;
    margin-bottom:8px;

}

.titulo span{

    color:#D4AF37;

}

.subtitulo{

    color:rgba(255,255,255,.72);
    line-height:1.7;
    margin-bottom:30px;

}

.btn-login{

    width:100%;
    border:none;
    border-radius:999px;
    padding:13px;

    background:#C9A227;

    color:#111827;

    font-weight:900;

    text-decoration:none;
    display:inline-block;

    transition:.3s;

}

.btn-login:hover{

    background:#B8860B;
    color:#111827;
    transform:translateY(-2px);

}

</style>

</head>

<body>

<video autoplay muted loop playsinline class="bg-video">
    <source src="{% static 'videos/Video.mp4' %}" type="video/mp4">
</video>

<div class="video-overlay"></div>

<div class="reset-box">

    <img src="{% static 'img/imagen.png' %}"
         class="logo">

    <div class="icon-success">
        <i class="fa-solid fa-circle-check"></i>
    </div>

    <h2 class="titulo">
        Contraseña <span>actualizada</span>
    </h2>

    <p class="subtitulo">

        Tu contraseña se cambió correctamente.

        Ya puedes iniciar sesión con tus nuevas credenciales.

    </p>

    <a href="{% url 'login' %}"
       class="btn-login">

        <i class="fa-solid fa-right-to-bracket me-2"></i>

        Ir al inicio de sesión

    </a>

</div>

</body>
</html>
