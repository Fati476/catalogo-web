{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo enviado</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    overflow:hidden;
}

.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg, rgba(0,0,0,.82), rgba(15,15,15,.55), rgba(0,0,0,.82));
    z-index:-2;
}

.reset-box{
    width:100%;
    max-width:430px;
    background:rgba(15,15,15,.58);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);
    border-radius:30px;
    padding:34px;
    color:white;
    text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    animation:aparecer .65s ease;
}

@keyframes aparecer{
    from{opacity:0;transform:translateY(25px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.logo-reset{
    display:block;
    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:50%;
    margin:0 auto 18px;
    background:white;
    padding:6px;
}

.icon-success{
    width:62px;
    height:62px;
    border-radius:50%;
    background:#C9A227;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    margin:0 auto 18px;
}

.titulo{
    font-weight:900;
    font-size:2rem;
}

.titulo span{
    color:#D4AF37;
}

.subtitulo{
    color:rgba(255,255,255,.72);
    margin-bottom:24px;
    font-size:.95rem;
    line-height:1.6;
}

.link-login{
    color:rgba(255,255,255,.82);
    text-decoration:none;
    font-weight:700;
}

.link-login:hover{
    color:#D4AF37;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline class="bg-video">
    <source src="{% static 'videos/Video.mp4' %}" type="video/mp4">
</video>

<div class="video-overlay"></div>

<div class="reset-box">

    <img src="{% static 'img/imagen.png' %}" class="logo-reset">

    <div class="icon-success">
        <i class="fa-solid fa-envelope-circle-check"></i>
    </div>

    <h2 class="titulo">
        Correo <span>enviado</span>
    </h2>

    <p class="subtitulo">
        Si el correo está registrado en el sistema, recibirás un enlace para restablecer tu contraseña.
    </p>

    <a href="{% url 'login' %}" class="link-login">
        Volver al inicio de sesión
    </a>

</div>

</body>
</html>
