<!-- ============================= -->
<!-- 🚀 PIROIA - CHATBOT -->
<!-- ============================= -->

<div class="piroia-container">

    <!-- Botón flotante -->
    <button
        type="button"
        class="piroia-button"
        id="piroiaButton"
        aria-label="Abrir asistente PiroIA"
        title="Asistente PiroIA">

        <span class="piroia-firework">
            <span class="firework-ray ray-1"></span>
            <span class="firework-ray ray-2"></span>
            <span class="firework-ray ray-3"></span>
            <span class="firework-ray ray-4"></span>
            <span class="firework-ray ray-5"></span>
            <span class="firework-ray ray-6"></span>
            <span class="firework-center"></span>
        </span>

    </button>


    <!-- Ventana del chatbot -->
    <div class="piroia-chat" id="piroiaChat">

        <!-- Encabezado -->
        <div class="piroia-header">

            <div class="piroia-title">

                <div class="piroia-icon">
                    <span class="piroia-ai-core">
                        <span class="ai-core-dot"></span>
                    </span>
                </div>

            </div>

            <button
                type="button"
                class="piroia-close"
                id="piroiaClose"
                aria-label="Cerrar asistente">
                ×
            </button>

        </div>


        <!-- Mensajes -->
        <div class="piroia-messages" id="piroiaMessages">

            <div class="piroia-message piroia-message-bot">

                <div class="piroia-avatar">
                    <span class="piroia-ai-mini">
                        <span class="ai-mini-dot"></span>
                    </span>
                </div>

                <div class="piroia-bubble">
                    ¡Hola! 👋<br>
                    Soy <strong>PiroIA</strong>, tu asistente del catálogo.
                    <br><br>
                    Puedo ayudarte a consultar nuestros productos,
                    categorías y características.
                </div>

            </div>

        </div>


        <!-- Entrada -->
        <div class="piroia-input-area">

            <input
                type="text"
                id="piroiaInput"
                class="piroia-input"
                placeholder="Escribe tu pregunta..."
                autocomplete="off">

            <button
                type="button"
                id="piroiaSend"
                class="piroia-send"
                aria-label="Enviar mensaje">
                ➤
            </button>

        </div>

    </div>

</div>


<style>

/* ========================================= */
/* CONTENEDOR GENERAL */
/* ========================================= */

.piroia-container {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 99999;
    font-family: Arial, Helvetica, sans-serif;
}


/* ========================================= */
/* BOTÓN FLOTANTE */
/* ========================================= */

.piroia-button {

    width: 64px;
    height: 64px;

    border: none;
    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #D4AF37,
        #C9A227
    );

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35),
        0 0 0 4px rgba(212, 175, 55, 0.15);

    cursor: pointer;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


/* Cohete */




/* Brillito */

.piroia-sparkle {

    position: absolute;

    top: 7px;
    right: 8px;

    font-size: 14px;

    animation: piroiaSparkle 1.5s infinite ease-in-out;

}


/* Hover */

.piroia-button:hover {

    transform: scale(1.08);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 0 6px rgba(212, 175, 55, 0.18);

}



/* ========================================= */
/* ICONO PIROTECNIA */
/* ========================================= */

.piroia-firework {
    position: relative;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Centro de la explosión */

.firework-center {
    position: absolute;
    width: 9px;
    height: 9px;
    background: #fff8d6;
    border-radius: 50%;
    box-shadow:
        0 0 6px #ffffff,
        0 0 12px #D4AF37,
        0 0 20px rgba(212,175,55,.9);
}

/* Rayos */

.firework-ray {
    position: absolute;
    width: 3px;
    height: 13px;
    border-radius: 999px;
    background: linear-gradient(
        to top,
        #D4AF37,
        #fff8d6
    );
    transform-origin: center bottom;
    animation: fireworkPulse 1.8s infinite ease-in-out;
}

/* Posiciones */

.ray-1 {
    transform: rotate(0deg) translateY(-11px);
}

.ray-2 {
    transform: rotate(60deg) translateY(-11px);
}

.ray-3 {
    transform: rotate(120deg) translateY(-11px);
}

.ray-4 {
    transform: rotate(180deg) translateY(-11px);
}

.ray-5 {
    transform: rotate(240deg) translateY(-11px);
}

.ray-6 {
    transform: rotate(300deg) translateY(-11px);
}

/* Animación */

@keyframes fireworkPulse {

    0%, 100% {
        opacity: .6;
    }

    50% {
        opacity: 1;
        filter: brightness(1.5);
    }

}

/* Efecto al pasar el mouse */

.piroia-button:hover .piroia-firework {
    transform: scale(1.12);
    transition: transform .25s ease;
}

/* ========================================= */
/* ANIMACIÓN DEL BRILLO */
/* ========================================= */

@keyframes piroiaSparkle {

    0%,
    100% {
        transform: scale(0.8);
        opacity: 0.5;
    }

    50% {
        transform: scale(1.2);
        opacity: 1;
    }

}


/* ========================================= */
/* VENTANA DEL CHAT */
/* ========================================= */

.piroia-chat {

    position: absolute;

    right: 0;
    bottom: 78px;

    width: 370px;
    max-width: calc(100vw - 30px);

    height: 520px;
    max-height: calc(100vh - 120px);

    background: #ffffff;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);

    border: 1px solid rgba(212, 175, 55, 0.35);

    display: none;

    flex-direction: column;

}


/* ========================================= */
/* ENCABEZADO */
/* ========================================= */

.piroia-header {

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;

    padding: 15px 17px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.piroia-title {

    display: flex;

    align-items: center;

    gap: 10px;

}


.piroia-icon {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: rgba(212, 175, 55, 0.15);

    border: 1px solid rgba(212, 175, 55, 0.5);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 21px;

}

/* ========================================= */
/* NÚCLEO DE IA */
/* ========================================= */

.piroia-ai-core {
    position: relative;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Órbita exterior */

.piroia-ai-core::before {
    content: "";
    position: absolute;
    width: 25px;
    height: 11px;
    border: 1.5px solid #D4AF37;
    border-radius: 50%;
    transform: rotate(35deg);
    box-shadow: 0 0 8px rgba(212,175,55,.55);
    animation: aiOrbit 2.4s linear infinite;
}

/* Segunda órbita */

.piroia-ai-core::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 11px;
    border: 1.5px solid rgba(255,255,255,.75);
    border-radius: 50%;
    transform: rotate(-35deg);
    animation: aiOrbitReverse 2.4s linear infinite;
}

/* Núcleo */

.ai-core-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fff8d6;

    box-shadow:
        0 0 5px #ffffff,
        0 0 10px #D4AF37,
        0 0 18px rgba(212,175,55,.9);

    animation: aiCorePulse 1.5s infinite ease-in-out;
}

/* Animaciones */

@keyframes aiOrbit {

    0% {
        transform: rotate(35deg);
    }

    100% {
        transform: rotate(395deg);
    }

}

@keyframes aiOrbitReverse {

    0% {
        transform: rotate(-35deg);
    }

    100% {
        transform: rotate(-395deg);
    }

}

@keyframes aiCorePulse {

    0%, 100% {
        transform: scale(.8);
        opacity: .75;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }

}

/* ========================================= */
/* MINI NÚCLEO DE IA DEL CHAT */
/* ========================================= */

.piroia-ai-mini {
    position: relative;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Órbita */

.piroia-ai-mini::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 8px;
    border: 1px solid #D4AF37;
    border-radius: 50%;
    transform: rotate(45deg);
    animation: miniOrbit 2s linear infinite;
}

/* Segunda órbita */

.piroia-ai-mini::after {
    content: "";
    position: absolute;
    width: 19px;
    height: 8px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 50%;
    transform: rotate(-45deg);
    animation: miniOrbitReverse 2s linear infinite;
}

/* Punto central */

.ai-mini-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #D4AF37;

    box-shadow:
        0 0 5px #D4AF37,
        0 0 10px rgba(212,175,55,.8);
}

@keyframes miniOrbit {

    from {
        transform: rotate(45deg);
    }

    to {
        transform: rotate(405deg);
    }

}

@keyframes miniOrbitReverse {

    from {
        transform: rotate(-45deg);
    }

    to {
        transform: rotate(-405deg);
    }

}


.piroia-title strong {

    display: block;

    font-size: 1rem;

    color: #D4AF37;

}


.piroia-title small {

    display: block;

    margin-top: 2px;

    color: #e5e7eb;

    font-size: 0.75rem;

}


.piroia-close {

    border: none;

    background: transparent;

    color: white;

    font-size: 28px;

    line-height: 1;

    cursor: pointer;

    opacity: 0.8;

}


.piroia-close:hover {

    opacity: 1;

    color: #D4AF37;

}


/* ========================================= */
/* MENSAJES */
/* ========================================= */

.piroia-messages {

    flex: 1;

    padding: 18px;

    overflow-y: auto;

    background: #f8fafc;

}


.piroia-message {

    display: flex;

    align-items: flex-start;

    gap: 8px;

    margin-bottom: 15px;

}


.piroia-avatar {

    width: 32px;
    height: 32px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #111827;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;

}


.piroia-bubble {

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 5px 15px 15px 15px;

    padding: 11px 13px;

    color: #374151;

    font-size: 0.88rem;

    line-height: 1.5;

    box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.04);

}


/* ========================================= */
/* ÁREA DE ESCRITURA */
/* ========================================= */

.piroia-input-area {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 12px;

    background: white;

    border-top: 1px solid #e5e7eb;

}


.piroia-input {

    flex: 1;

    min-width: 0;

    border: 1px solid #d1d5db;

    border-radius: 999px;

    padding: 10px 14px;

    outline: none;

    font-size: 0.88rem;

}


.piroia-input:focus {

    border-color: #C9A227;

    box-shadow:
        0 0 0 3px rgba(201, 162, 39, 0.12);

}


.piroia-send {

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: #C9A227;

    color: #111827;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: transform 0.2s ease;

}


.piroia-send:hover {

    transform: scale(1.05);

}


/* ========================================= */
/* RESPONSIVE */
/* ========================================= */

@media (max-width: 576px) {

    .piroia-container {

        right: 15px;

        bottom: 15px;

    }


    .piroia-button {

        width: 58px;

        height: 58px;

    }


    .piroia-chat {

        right: -2px;

        bottom: 70px;

        width: calc(100vw - 30px);

        height: 480px;

    }

}

</style>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const button = document.getElementById("piroiaButton");
    const chat = document.getElementById("piroiaChat");
    const close = document.getElementById("piroiaClose");

    const input = document.getElementById("piroiaInput");
    const send = document.getElementById("piroiaSend");
    const messages = document.getElementById("piroiaMessages");

    if (!button || !chat || !close || !input || !send || !messages) {
        console.error("PiroIA: No se encontraron todos los elementos del chatbot.");
        return;
    }


    /* ========================================= */
    /* MEMORIA DE LA CONVERSACIÓN */
    /* ========================================= */

    const claveConversacion = "piroia_conversacion";


    function guardarConversacion() {

        const mensajes = [];

        messages.querySelectorAll(
            ".piroia-message-user, .piroia-message-bot"
        ).forEach(function (mensaje) {

            /* No guardar el indicador de "PiroIA está pensando..." */
            if (mensaje.id === "piroiaTyping") {
                return;
            }

            const burbuja = mensaje.querySelector(".piroia-bubble");

            if (!burbuja) {
                return;
            }

            mensajes.push({
                tipo: mensaje.classList.contains("piroia-message-user")
                    ? "usuario"
                    : "bot",

                texto: burbuja.textContent
            });

        });


        sessionStorage.setItem(
            claveConversacion,
            JSON.stringify(mensajes)
        );

    }


    function cargarConversacion() {

        const guardada = sessionStorage.getItem(
            claveConversacion
        );

        if (!guardada) {
            return;
        }


        try {

            const mensajesGuardados = JSON.parse(guardada);


            mensajesGuardados.forEach(function (mensaje) {

                if (mensaje.tipo === "usuario") {

                    agregarMensajeUsuario(
                        mensaje.texto,
                        false
                    );

                } else {

                    agregarMensajeBot(
                        mensaje.texto,
                        false
                    );

                }

            });


            messages.scrollTop = messages.scrollHeight;


        } catch (error) {

            console.error(
                "PiroIA: No se pudo recuperar la conversación.",
                error
            );


            sessionStorage.removeItem(
                claveConversacion
            );

        }

    }


    /* ========================================= */
    /* ABRIR CHAT */
    /* ========================================= */

    button.addEventListener("click", function () {

        chat.style.display = "flex";
        button.style.display = "none";

        setTimeout(function () {
            input.focus();
        }, 100);

    });


    /* ========================================= */
    /* CERRAR CHAT */
    /* ========================================= */

    close.addEventListener("click", function () {

        chat.style.display = "none";
        button.style.display = "flex";

    });


    /* ========================================= */
    /* OBTENER CSRF */
    /* ========================================= */

    function obtenerCSRF() {

        const cookies = document.cookie.split(";");


        for (let cookie of cookies) {

            cookie = cookie.trim();


            if (cookie.startsWith("csrftoken=")) {

                return decodeURIComponent(
                    cookie.substring("csrftoken=".length)
                );

            }

        }


        return "";

    }


    /* ========================================= */
    /* AGREGAR MENSAJE DEL USUARIO */
    /* ========================================= */

    function agregarMensajeUsuario(
        texto,
        guardar = true
    ) {

        const contenedor = document.createElement("div");

        contenedor.className =
            "piroia-message piroia-message-user";

        contenedor.style.justifyContent = "flex-end";


        const burbuja = document.createElement("div");

        burbuja.className = "piroia-bubble";

        burbuja.style.background = "#C9A227";
        burbuja.style.color = "#111827";
        burbuja.style.borderRadius = "15px 5px 15px 15px";

        burbuja.textContent = texto;


        contenedor.appendChild(burbuja);

        messages.appendChild(contenedor);

        messages.scrollTop = messages.scrollHeight;


        /* Guardar conversación */

        if (guardar) {

            guardarConversacion();

        }

    }


    /* ========================================= */
    /* AGREGAR RESPUESTA DE PIROIA */
    /* ========================================= */

    function agregarMensajeBot(
        texto,
        guardar = true
    ) {

        const contenedor = document.createElement("div");

        contenedor.className =
            "piroia-message piroia-message-bot";


        const avatar = document.createElement("div");

        avatar.className = "piroia-avatar";


        const miniIA = document.createElement("span");

        miniIA.className = "piroia-ai-mini";


        const punto = document.createElement("span");

        punto.className = "ai-mini-dot";


        miniIA.appendChild(punto);

        avatar.appendChild(miniIA);


        const burbuja = document.createElement("div");

        burbuja.className = "piroia-bubble";

        burbuja.textContent = texto;


        contenedor.appendChild(avatar);

        contenedor.appendChild(burbuja);

        messages.appendChild(contenedor);

        messages.scrollTop = messages.scrollHeight;


        /* Guardar conversación */

        if (guardar) {

            guardarConversacion();

        }

    }


    /* ========================================= */
    /* INDICADOR DE RESPUESTA */
    /* ========================================= */

    function mostrarEscribiendo() {

        const indicador = document.createElement("div");

        indicador.id = "piroiaTyping";

        indicador.className =
            "piroia-message piroia-message-bot";


        const avatar = document.createElement("div");

        avatar.className = "piroia-avatar";


        const miniIA = document.createElement("span");

        miniIA.className = "piroia-ai-mini";


        const punto = document.createElement("span");

        punto.className = "ai-mini-dot";


        miniIA.appendChild(punto);

        avatar.appendChild(miniIA);


        const burbuja = document.createElement("div");

        burbuja.className = "piroia-bubble";

        burbuja.textContent =
            "PiroIA está pensando...";


        indicador.appendChild(avatar);

        indicador.appendChild(burbuja);

        messages.appendChild(indicador);

        messages.scrollTop = messages.scrollHeight;

    }


    /* ========================================= */
    /* QUITAR INDICADOR */
    /* ========================================= */

    function quitarEscribiendo() {

        const indicador =
            document.getElementById("piroiaTyping");


        if (indicador) {

            indicador.remove();

        }

    }


    /* ========================================= */
    /* ENVIAR MENSAJE */
    /* ========================================= */

    async function enviarMensaje() {

        const pregunta = input.value.trim();


        if (!pregunta) {

            return;

        }


        /* Mostrar mensaje del usuario */

        agregarMensajeUsuario(pregunta);


        input.value = "";

        input.disabled = true;

        send.disabled = true;


        /* Mostrar indicador */

        mostrarEscribiendo();


        try {

            const respuesta = await fetch(
                "/api/chatbot/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": obtenerCSRF()
                    },

                    body: JSON.stringify({
                        mensaje: pregunta
                    })
                }
            );


            const datos = await respuesta.json();


            quitarEscribiendo();


            if (datos.ok) {

                agregarMensajeBot(
                    datos.respuesta
                );

            } else {

                agregarMensajeBot(
                    datos.respuesta ||
                    "No pude procesar tu pregunta."
                );

            }


        } catch (error) {

            console.error(
                "Error comunicando con PiroIA:",
                error
            );


            quitarEscribiendo();


            agregarMensajeBot(
                "No pude conectarme con PiroIA en este momento."
            );

        }


        input.disabled = false;

        send.disabled = false;

        input.focus();

    }


    /* ========================================= */
    /* BOTÓN ENVIAR */
    /* ========================================= */

    send.addEventListener(
        "click",
        enviarMensaje
    );


    /* ========================================= */
    /* ENTER PARA ENVIAR */
    /* ========================================= */

    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                enviarMensaje();

            }

        }
    );


    /* ========================================= */
    /* RECUPERAR CONVERSACIÓN */
    /* ========================================= */

    cargarConversacion();


    console.log(
        "PiroIA: JavaScript cargado correctamente."
    );

});
</script>
</script>
